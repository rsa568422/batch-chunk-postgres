name: Build, Test, and Analyze

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean package
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: package
          path: '**/target/*.jar'

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests and mutation coverage
        run: mvn verify org.pitest:pitest-maven:mutationCoverage
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: '**/target/surefire-reports'
      - name: Upload PIT reports
        uses: actions/upload-artifact@v3
        with:
          name: pit-reports
          path: '**/target/pit-reports'

  analyze:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download PIT reports
        uses: actions/download-artifact@v3
        with:
          name: pit-reports
      - name: Check testing coverage
        run: |
          chmod +x .github/scripts/summary.sh
          bash .github/scripts/summary.sh
      - name: Check PIT Mutation coverage
        run: |
          chmod +x .github/scripts/pit_score.sh
          bash .github/scripts/pit_score.sh